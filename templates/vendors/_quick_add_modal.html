<div class="modal fade" id="quickAddVendorModal" tabindex="-1" aria-labelledby="quickAddVendorModalLabel" aria-hidden="true"
     data-quick-add-url="{{ url_for('vendors.quick_add') }}" data-csrf-token="{{ csrf_token() }}">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header py-2">
                <h6 class="modal-title" id="quickAddVendorModalLabel"><i class="bi bi-shop"></i> Quick-Add Vendor</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <label for="quickVendorName" class="form-label">Vendor Name</label>
                <input type="text" id="quickVendorName" class="form-control" placeholder="e.g. Tesco">
                <div id="quickVendorError" class="text-danger small mt-1" role="alert" style="display:none;"></div>
            </div>
            <div class="modal-footer py-2">
                <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                <button type="button" id="quickVendorSubmit" class="btn btn-primary btn-sm" onclick="submitQuickAddVendor()">
                    <i class="bi bi-plus-circle"></i> Add Vendor
                </button>
            </div>
        </div>
    </div>
</div>
