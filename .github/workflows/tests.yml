name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-postgres.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-postgres.txt
      - name: Run tests
        run: python -m pytest -q

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: joneshq_ci_application
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d joneshq_ci_application"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/joneshq_ci_application
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-postgres.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-postgres.txt -r requirements-dev.txt
      - name: Select matching PostgreSQL client tools
        run: |
          test -x /usr/lib/postgresql/17/bin/pg_dump
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Run PostgreSQL application and migration regressions
        run: >-
          python -m pytest -q
          tests/test_household_isolation.py
          tests/test_balance_recalculation.py
          tests/test_payday_service.py
          tests/test_credit_card_service.py
          tests/test_expense_service.py
          tests/test_postgres_integration.py
