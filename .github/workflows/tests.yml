name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: joneshq_ci_rehearsal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d joneshq_ci_rehearsal"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PG_REHEARSAL_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/joneshq_ci_rehearsal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-postgres.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-postgres.txt
      - name: Run tests
        run: python -m pytest -q
